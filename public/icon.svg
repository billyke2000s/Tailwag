<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Canine Paw & Heart matching emblem -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Main Paw Pad as Heart -->
    <path d="M256 385 C230 355, 160 300, 160 250 C160 215, 185 190, 220 190 C238 190, 249 198, 256 208 C263 198, 274 190, 292 190 C327 190, 352 215, 352 250 C352 300, 282 355, 256 385 Z"/>

    <!-- Toe 1 (Far Left) -->
    <ellipse cx="145" cy="180" rx="28" ry="38" transform="rotate(-30 145 180)"/>

    <!-- Toe 2 (Inner Left) -->
    <ellipse cx="215" cy="130" rx="28" ry="40" transform="rotate(-10 215 130)"/>

    <!-- Toe 3 (Inner Right) -->
    <ellipse cx="297" cy="130" rx="28" ry="40" transform="rotate(10 297 130)"/>

    <!-- Toe 4 (Far Right) -->
    <ellipse cx="367" cy="180" rx="28" ry="38" transform="rotate(30 367 180)"/>
  </g>
</svg>
