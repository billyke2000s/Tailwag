name: Shelter platform checks
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['**/*.md', 'docs/assets/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tailwag-platform-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: care_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: care_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U care_test -d care_test" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r platform/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Audit locked Python packages
        run: |
          .venv/bin/pip install pip-audit==2.10.1
          .venv/bin/pip-audit -r platform/requirements.txt --no-deps
      - name: Audit native browser library inventory
        run: npm audit --prefix platform/browser-dependencies --omit=dev
      - name: Fetch pinned core and compile
        run: |
          .venv/bin/python platform/scripts/fetch-core.py
          .venv/bin/python -m compileall -q platform/shelter platform/scripts
      - name: Connected workflow tests
        run: .venv/bin/python platform/scripts/test.py
      - name: Backup maintenance failure handling
        run: .venv/bin/python platform/scripts/test-backup.py
      - name: Adopted domain tests
        run: .venv/bin/python platform/scripts/test-core.py
      - name: PostgreSQL install, migration and restore
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: care_test
          PGUSER: care_test
          PGPASSWORD: synthetic-ci-only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          .venv/bin/python platform/scripts/test-postgres.py
      - name: Browser workflows and responsive screens
        run: node platform/scripts/browser-test.mjs
      - name: Build deployment image
        run: docker build -t tailwag-care:ci platform
      - name: Start applications with production settings
        run: sh platform/scripts/test-deployment.sh
      - name: Validate server configuration
        working-directory: platform
        run: |
          cp .env.example .env
          PGDATABASE=synthetic_test PGUSER=synthetic_test PGPASSWORD=synthetic-ci-only PUBLIC_DOMAIN=care.example.invalid STAFF_DOMAIN=team.example.invalid docker compose config --quiet
          docker run --rm -e PUBLIC_DOMAIN=care.example.invalid -e STAFF_DOMAIN=team.example.invalid -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-platform-screens
          path: docs/assets/platform/

      - name: Package operational candidate source
        if: github.event_name == 'push'
        run: |
          mkdir release-care
          tar --exclude='platform/runtime' --exclude='platform/staticfiles' --exclude='__pycache__' --exclude='*.pyc' --exclude='platform/vendor/asm/scripts/schema/schema.db' --exclude='.env' --exclude='.git' -czf release-care/TailWag-Care-0.1.0-alpha.1-source.tar.gz platform *.md docs .github/workflows/platform.yml
          cd release-care
          sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Verify extracted candidate setup
        if: github.event_name == 'push'
        run: |
          SOURCE_TEST=$(mktemp -d)
          tar -xzf release-care/TailWag-Care-0.1.0-alpha.1-source.tar.gz -C "$SOURCE_TEST"
          .venv/bin/python "$SOURCE_TEST/platform/scripts/dev.py" --prepare
          .venv/bin/python "$SOURCE_TEST/platform/scripts/dev.py" --seed
          test -f "$SOURCE_TEST/platform/runtime/core.sqlite3"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: operational-candidate-source
          path: release-care/
  candidate-release:
    name: Publish operational evaluation candidate
    needs: platform
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/shelter-platform'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: operational-candidate-source
          path: release-care
      - name: Publish candidate once after verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=care-v0.1.0-alpha.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Candidate already published; preserving its revision and assets.'
            exit 0
          fi
          gh release create "$TAG" release-care/* --target "$GITHUB_SHA" --prerelease --title 'TailWag Care 0.1.0-alpha.1 · Evaluation candidate' --notes-file docs/releases/care-v0.1.0-alpha.1.md
